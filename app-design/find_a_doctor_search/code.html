<span class="material-symbols-outlined text-[22px]">child_care</span>
</div>
<div>
<span class="font-label-lg text-label-lg text-on-surface group-hover:text-primary font-medium block">Child doctor</span>
<span class="font-body-sm text-body-sm text-text-muted">Pediatrician, infant fever</span>
</div>
</div>
<span class="material-symbols-outlined text-text-muted group-hover:text-primary text-[20px] transition-transform group-active:translate-x-0.5">north_east</span>

</div>

<!-- Big Thumb-Friendly Search Trigger -->
<section class="w-full mt-auto">
<button class="w-full h-14 bg-primary text-on-primary font-label-lg text-label-lg font-bold rounded-xl shadow-sm flex items-center justify-center gap-space-sm active:bg-secondary active:scale-[0.99] transition-all" id="submit-search-btn" type="button">
<span class="material-symbols-outlined text-[22px]">search</span>
<span>Search doctors</span>
</button>
<p class="text-center font-body-sm text-body-sm text-text-muted mt-space-sm">
      Free public directory • Verified timings
    </p>
</section>
</div>
<script>
  (function() {
    const input = document.getElementById('doctor-search-input');
    const clearBtn = document.getElementById('clear-search-btn');
    const searchBtn = document.getElementById('submit-search-btn');
    const chips = document.querySelectorAll('.suggestion-chip');
    const changeLocBtn = document.getElementById('change-location-btn');
    const locLabel = document.getElementById('current-location-label');

    function toggleClearVisibility() {
      if (input.value.trim().length > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
    }

    input.addEventListener('input', toggleClearVisibility);

    clearBtn.addEventListener('click', function() {
      input.value = '';
      input.focus();
      toggleClearVisibility();
    });

    chips.forEach(function(chip) {
      chip.addEventListener('click', function() {
        const term = this.getAttribute('data-term');
        input.value = term;
        toggleClearVisibility();
        input.focus();
        
        // Haptic feedback if supported
        if (navigator.vibrate) {
          navigator.vibrate(20);
        }
      });
    });

    searchBtn.addEventListener('click', function() {
      const query = input.value.trim();
      if (!query) {
        input.focus();
      } else {
        // Subtle active animation indicator
        searchBtn.classList.add('opacity-90');
        setTimeout(function() {
          searchBtn.classList.remove('opacity-90');
        }, 300);
      }
    });

    changeLocBtn.addEventListener('click', function() {
      const towns = ['Near Gopiballavpur', 'Near Jhargram', 'Near Kharagpur', 'Near Belda'];
      const current = locLabel.textContent.trim();
      const nextIndex = (towns.indexOf(current) + 1) % towns.length;
      locLabel.textContent = towns[nextIndex];
    });

    // Auto focus on screen ready
    setTimeout(function() {
      if (input) input.focus();
    }, 150);
  })();
</script></main></body></html>
